# ==============================================================================
# docker-compose.monitoring.yml — Observability & Alerting Stack
# Services: Prometheus (9090), Node Exporter (9100), Alertmanager (9093), Grafana (3000)
# Connects seamlessly to the live campusconnect_network bridge network.
# ==============================================================================

services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: campusconnect-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - campusconnect-net

  prometheus:
    image: prom/prometheus:latest
    container_name: campusconnect-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - campusconnect-net
    depends_on:
      - node-exporter

  alertmanager:
    image: prom/alertmanager:latest
    container_name: campusconnect-alertmanager
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    networks:
      - campusconnect-net

  grafana:
    image: grafana/grafana:latest
    container_name: campusconnect-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - campusconnect-net
    depends_on:
      - prometheus

volumes:
  prometheus_data:
    name: campusconnect_prometheus_data
  alertmanager_data:
    name: campusconnect_alertmanager_data
  grafana_data:
    name: campusconnect_grafana_data

networks:
  campusconnect-net:
    name: campusconnect_network
    external: true
