# ==============================================================================
# systemd/nginx.conf — CampusConnect Production Reverse Proxy Configuration
# Handles Static SPA Delivery, API Proxying, Gzip, and Security Headers
# ==============================================================================

server {
    listen 80;
    server_name campusconnect.local yourdomain.com;
    
    # Redirect HTTP to HTTPS in production
    # return 301 https://$host$request_uri;

    root /opt/campusconnect/frontend/dist;
    index index.html;
    client_max_body_size 10M;

    # Gzip Compression Optimization
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend Single Page App (SPA) Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Reverse Proxy Routing to Node.js Backend
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    # Proxy uploaded resumes/offers to Node.js Backend
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static Assets Caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # Deny access to hidden / git files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
