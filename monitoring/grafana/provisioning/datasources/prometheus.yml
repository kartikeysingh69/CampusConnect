# ==============================================================================
# monitoring/grafana/provisioning/datasources/prometheus.yml
# Automatically provisions Prometheus as Grafana's default datasource on boot.
# ==============================================================================

apiVersion: 1

datasources:
  - name: Prometheus
    uid: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
