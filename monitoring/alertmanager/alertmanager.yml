# ==============================================================================
# monitoring/alertmanager/alertmanager.yml — Alert Routing (Slack & Email SMTP)
# Replace placeholder Slack webhook / SMTP password with real secrets before prod.
# ==============================================================================

global:
  resolve_timeout: 5m
  # smtp_smarthost: 'smtp.gmail.com:587'
  # smtp_from: 'alerts@campusconnect.edu'
  # smtp_auth_username: 'alerts@campusconnect.edu'
  # smtp_auth_password: 'YOUR_APP_PASSWORD'

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  receiver: 'campusconnect-devops-webhook'
  routes:
    - match:
        severity: critical
      receiver: 'campusconnect-devops-webhook'
      repeat_interval: 15m

receivers:
  - name: 'campusconnect-devops-webhook'
    # Local / Slack / Email integration hooks:
    # Un-comment slack_configs or email_configs when live credentials are added:
    #
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXX'
    #     channel: '#campusconnect-alerts'
    #     send_resolved: true
    #     title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
    #     text: '{{ .CommonAnnotations.summary }} - {{ .CommonAnnotations.description }}'
    #
    # email_configs:
    #   - to: 'devops-team@campusconnect.edu'
    #     send_resolved: true
    webhook_configs:
      - url: 'http://backend:5000/api/alerts/webhook'
        send_resolved: true
