# ==============================================================================
# docker-compose.dev.yml — Local Development Stack with Live Code Reloading
# Usage: docker compose -f docker-compose.dev.yml up
# ==============================================================================

services:
  db:
    image: mysql:8.4
    container_name: campusconnect-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: campusconnect
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./backend/config/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - campusconnect-dev-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: node:22-alpine
    container_name: campusconnect-backend-dev
    working_dir: /app
    volumes:
      # Bind mount local backend code for nodemon live reloading
      - ./backend:/app/backend
      - ./package.json:/app/package.json
      - /app/node_modules
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: campusconnect
      JWT_SECRET: campusconnect_dev_secret
    command: sh -c "npm install && npx nodemon backend/server.js"
    networks:
      - campusconnect-dev-net
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    container_name: campusconnect-frontend-dev
    working_dir: /app
    volumes:
      # Bind mount local frontend code for Vite HMR live reloading
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - campusconnect-dev-net
    depends_on:
      - backend

volumes:
  mysql_dev_data:

networks:
  campusconnect-dev-net:
    driver: bridge
