<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="cc-orange-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="cc-glow" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.6" />
    </linearGradient>
    <filter id="cc-shadow" x="-4" y="-2" width="72" height="72" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#ea580c" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Orange Rounded Square Badge -->
  <rect x="6" y="6" width="52" height="52" rx="14" fill="url(#cc-orange-grad)" filter="url(#cc-shadow)" />
  <rect x="7" y="7" width="50" height="50" rx="13" stroke="url(#cc-glow)" stroke-width="1.2" fill="none" opacity="0.6" />

  <!-- Graduation Cap Rhombus (Top) -->
  <polygon points="32,18 50,26 32,34 14,26" fill="#ffffff" />
  
  <!-- Graduation Cap Under Skullcap -->
  <path d="M20,29.5 L20,38 C20,42 25,45 32,45 C39,45 44,42 44,38 L44,29.5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

  <!-- Tassel Ribbon & Drop -->
  <path d="M44,27.5 L47.5,33 L47.5,39" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round" />
  <circle cx="47.5" cy="40" r="1.8" fill="#facc15" />
  <circle cx="32" cy="26" r="2" fill="#ea580c" />

  <!-- Connecting Nodes under Cap -->
  <circle cx="23" cy="48" r="1.8" fill="#ffedd5" />
  <circle cx="32" cy="50" r="2.2" fill="#ffffff" />
  <circle cx="41" cy="48" r="1.8" fill="#ffedd5" />
  <path d="M23 48 L32 50 L41 48" stroke="#fed7aa" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.8" />
</svg>
