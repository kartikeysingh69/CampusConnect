# ==============================================================================
# docker-compose.yml — CampusConnect Multi-Container Production Stack
# Services: MySQL 8.4 DB, Node.js 22 Backend API, Nginx Alpine Frontend SPA
# Demonstrates: Images, Containers, Named Volumes, Isolated Bridge Networks
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. DATABASE SERVICE (MySQL 8.4 Server)
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.4
    container_name: campusconnect-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-campusconnect}
    ports:
      - "${DB_PORT_BINDING:-3307}:3306"
    volumes:
      # Named persistent volume for DB data durability
      - mysql_data:/var/lib/mysql
      # Initial schema seeding script
      - ./backend/config/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - campusconnect-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------------------------
  # 2. BACKEND API SERVICE (Node.js 22 LTS)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: campusconnect-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-campusconnect}
      JWT_SECRET: ${JWT_SECRET:-campusconnect_enterprise_secret_key_2026}
    ports:
      - "${BACKEND_PORT_BINDING:-5001}:5000"
    volumes:
      # Persistent student resume & evaluation files
      - uploads_data:/app/backend/uploads
    networks:
      - campusconnect-net
    depends_on:
      db:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 3. FRONTEND SERVICE (Nginx Alpine SPA Web Server)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: campusconnect-frontend
    restart: always
    ports:
      - "80:80"
    networks:
      - campusconnect-net
    depends_on:
      backend:
        condition: service_healthy

# ------------------------------------------------------------------------------
# DOCKER CORE: NAMED VOLUMES (Data Persistence Across Container Restarts)
# ------------------------------------------------------------------------------
volumes:
  mysql_data:
    name: campusconnect_mysql_data
    driver: local
  uploads_data:
    name: campusconnect_uploads_data
    driver: local

# ------------------------------------------------------------------------------
# DOCKER CORE: NETWORKS (Isolated Bridge Network for Inter-Container DNS)
# ------------------------------------------------------------------------------
networks:
  campusconnect-net:
    name: campusconnect_network
    driver: bridge
