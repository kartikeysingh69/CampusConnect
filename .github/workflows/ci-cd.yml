name: CampusConnect CI/CD Pipeline

# ==============================================================================
# CampusConnect DevOps Pipeline — Automated Testing & Container Publishing
# Triggers: Push to main, Pull Requests, or Manual Trigger (workflow_dispatch)
# Registry: GitHub Container Registry (ghcr.io) + Optional Docker Hub
# ==============================================================================

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub UI during viva/demo

permissions:
  contents: read
  packages: write # Required to push images to GitHub Container Registry (GHCR)
  security-events: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository_owner }}/campusconnect-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository_owner }}/campusconnect-frontend

jobs:
  # ============================================================================
  # STAGE 1: CONTINUOUS INTEGRATION (Linting, Build & Unit Tests)
  # ============================================================================
  test:
    name: Run Unit Tests & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [ 22.x ]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Backend Dependencies
        run: npm ci

      - name: Run Backend Unit Tests (node:test)
        run: npm test

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify Frontend Production Build (Vite)
        working-directory: ./frontend
        run: npm test

  # ============================================================================
  # STAGE 2: CONTAINERIZATION & REGISTRY PUBLISHING (Docker Multi-Stage Build)
  # ============================================================================
  build-and-push:
    name: Build & Push Multi-Stage Docker Images
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry (Built-in, zero external setup)
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional: Log in to Docker Hub if secrets are configured
      - name: Log in to Docker Hub (Optional)
        if: "${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Docker Metadata Extraction (Tags & Labels for Backend)
      - name: Extract Metadata for Backend Image
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch

      # Build & Push Backend Container Image
      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Docker Metadata Extraction (Tags & Labels for Frontend)
      - name: Extract Metadata for Frontend Image
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch

      # Build & Push Frontend Container Image
      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Post-deployment Pipeline Summary for GitHub Actions UI
      - name: Generate Pipeline Execution Summary
        if: always()
        run: |
          echo "### 🚀 CampusConnect CI/CD Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Workflow Trigger** | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch / Commit** | \`${{ github.ref_name }}\` (\`${{ github.sha }}\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Unit Tests** | ✅ Passed (Node.js 22.x) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend Image** | \`${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend Image** | \`${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 **How to pull on any machine:**" >> $GITHUB_STEP_SUMMARY
          echo "> \`docker pull ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "> \`docker pull ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
