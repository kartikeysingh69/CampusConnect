# ==============================================================================
# k8s/01-config-and-secrets.yaml — ConfigMap & Secrets Separation
# ConfigMap stores non-sensitive settings; Secret stores base64 credentials.
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: campusconnect-config
  namespace: campusconnect
data:
  NODE_ENV: "production"
  PORT: "5000"
  DB_HOST: "mysql"
  DB_USER: "root"
  DB_NAME: "campusconnect"
---
apiVersion: v1
kind: Secret
metadata:
  name: campusconnect-secrets
  namespace: campusconnect
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "root"
  DB_PASSWORD: "root"
  JWT_SECRET: "campusconnect_k8s_secret_key_2026"
