# ==============================================================================
# k8s/05-hpa.yaml — Horizontal Pod Autoscaler (Auto-Scaling on CPU Load)
# Automatically scales backend (2 -> 5 pods) and frontend (2 -> 4 pods) under load.
# ==============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: campusconnect
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: campusconnect-backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: campusconnect
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: campusconnect-frontend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
